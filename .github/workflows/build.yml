
name: Build ZAID CLIENT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source
        run: |
          mkdir extracted
          unzip -q ZAID-CLIENT-source-1.zip -d extracted
          cd extracted/ZAID-CLIENT
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ZAID-CLIENT-JAR
          path: extracted/ZAID-CLIENT/build/libs/*.jar
